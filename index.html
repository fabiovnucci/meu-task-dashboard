<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="style.css">
    <title>Mycon Task Dashboard</title>
</head>
<body>

    <footer>
        <p>&copy; 2026 Mycon Task Dashboard</p>
    </footer>
    <script src="script.js"></script>

</body>
</html>
